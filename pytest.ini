[pytest]
# `dofus-network/kaggle/toolkit/` is a byte-identical mirror of `dofus-network/`,
# written by tools/sync_kaggle_toolkit.py and checked as gate.py's suite zero.
# Collecting both copies makes pytest import `agent.test_artifacts` twice under
# the same module name and abort the entire run with "import file mismatch":
# 53 errors and zero tests executed. The mirror is a published dataset, not a
# second test suite, so it is not collected.
norecursedirs =
    kaggle
    __pycache__
    .git
    .venv
    venv
    site-packages
    runtimes
    build
    dist
    node_modules

# Bare `pytest` means "the suites the gate runs", not the repository's scripts.
# `dofus-network/tools/` and the repository-root `tools/` share file names
# (test_session_report.py, test_progress_report.py, ...), so collecting both at
# once reproduces the same import mismatch one directory up.
testpaths = dofus-network
